<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="HTML to JSX Converter - Transform HTML into React JSX with detailed explanations" />
        <!-- Google AdSense -->
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1780366032174979"
         crossorigin="anonymous"></script>
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>HTML to JSX Converter</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script>
            // Remove Emergent badge if it exists (in case it was injected by cached scripts)
            (function() {
                function removeBadge() {
                    const badge = document.getElementById('emergent-badge');
                    if (badge) {
                        badge.remove();
                    }
                }
                // Remove immediately
                removeBadge();
                // Also remove after DOM is loaded (in case it's added dynamically)
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', removeBadge);
                }
                // Also check periodically for a short time (in case it's added after load)
                let attempts = 0;
                const interval = setInterval(function() {
                    removeBadge();
                    attempts++;
                    if (attempts > 10) {
                        clearInterval(interval);
                    }
                }, 100);
            })();
        </script>

    </body>
</html>
